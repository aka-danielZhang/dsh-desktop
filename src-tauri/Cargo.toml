[package]
name = "dsh-desktop"
version = "0.2.0-rc.10"
description = "Desktop shell for the DeepSeek Harness web UI"
edition = "2021"
license = "MIT"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Already in the dependency tree via tao/wry; a direct reference costs no
# extra compile. Used for the two AppKit adjustments Overlay windows still
# need: hiding the painted title (`NSWindowTitleVisibility::Hidden`) without
# losing the title string (Mission Control, the Window menu), and dropping
# the traffic-light row onto the bridge plugin's band-toggle line
# (`standardWindowButton` frame origins; NSButton→NSControl→NSView chain).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSNotification", "block2"] }
block2 = "0.6"

[profile.dev]
incremental = true
